[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "filter-tester"
version = "0.2.0"
description = "Test and compare stochastic filters on different systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Henrique Yuiti Kado" }]
keywords = ["kalman filter", "state estimation", "stochastic filtering", "monte carlo", "nees"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy", "scipy"]

[project.urls]
Homepage = "https://github.com/henrique-kado/Filter-tester"
Demo = "https://henrique-kado.github.io/Filter-tester/"
Changelog = "https://github.com/henrique-kado/Filter-tester/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Plots (filter_tester.plotting) and the example scripts
plot = ["matplotlib"]
test = ["pytest", "matplotlib"]
dev = ["pytest", "matplotlib", "ruff"]
# End-to-end test of the web interface (also needs a Chrome/Chromium browser)
ui-test = ["pytest", "matplotlib", "playwright"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
# README code blocks are aligned by hand; tests/test_readme.py runs them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
