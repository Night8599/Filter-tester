[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "filter-tester"
version = "0.1.0"
description = "Test and compare stochastic filters on different systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Henrique Yuiti Kado" }]
keywords = ["kalman filter", "state estimation", "stochastic filtering", "monte carlo", "nees"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy", "scipy"]

[project.urls]
Homepage = "https://github.com/Night8599/Filter-tester"
Demo = "https://night8599.github.io/Filter-tester/"
Changelog = "https://github.com/Night8599/Filter-tester/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Plots (filter_tester.plotting) and the example scripts
plot = ["matplotlib"]
test = ["pytest", "matplotlib"]
# End-to-end test of the web interface (also needs a Chrome/Chromium browser)
ui-test = ["pytest", "matplotlib", "playwright"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
